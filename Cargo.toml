[package]
name = "zfskit"
version = "0.2.2"
edition = "2024"
rust-version = "1.85"
description = "Async toolkit for OpenZFS: datasets, snapshots, send/recv streams, holds, bookmarks, pools - via the zfs/zpool CLI with JSON output"
authors = ["Danila Gornushko <me@okhsunrog.dev>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/okhsunrog/zfskit"
keywords = ["zfs", "openzfs", "snapshot", "replication", "async"]
categories = ["filesystem", "asynchronous", "api-bindings"]
readme = "README.md"
documentation = "https://docs.rs/zfskit"
exclude = ["justfile", "CLAUDE.md", ".gitignore", ".github"]

[dependencies]
async-trait = "0.1.89"
regex = "1.12.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
tokio = { version = "1.52.1", features = ["process", "io-util", "macros", "rt"] }
zeroize = "1.8.2"

[dev-dependencies]
tokio = { version = "1.52.1", features = ["macros", "rt-multi-thread", "time"] }

[features]
# Enables `tests/integration_*.rs` against a real ZFS-capable host reachable
# via SSH (ZFSKIT_SSH_TARGET=user@host:port). See `justfile` for the
# QEMU-based setup that uses the archzfs test ISO from the sibling
# archinstall_zfs repo.
integration = []
